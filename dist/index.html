<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0d10">
  <meta name="description" content="빠르고 정확한 온라인 스탑워치">
  <title>스탑워치</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230b0d10'/%3E%3Ccircle cx='32' cy='35' r='18' fill='none' stroke='%23ff5c35' stroke-width='5'/%3E%3Cpath d='M32 17v-7m-7 0h14M45 20l4-4' stroke='%23f4f1ea' stroke-width='5' stroke-linecap='round'/%3E%3Cpath d='M32 35l8-7' stroke='%23f4f1ea' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0d10;
      --panel: #12151a;
      --line: #292e36;
      --text: #f4f1ea;
      --muted: #9298a3;
      --accent: #ff5c35;
      --accent-strong: #ff704f;
      --lime: #c9ff5a;
      --radius: 22px;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 80% 15%, rgba(255, 92, 53, .09), transparent 31rem),
        radial-gradient(circle at 15% 85%, rgba(201, 255, 90, .055), transparent 26rem),
        var(--bg);
      color: var(--text);
      font-family: Inter, Pretendard, "Noto Sans KR", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: grid;
      place-items: center;
      padding: 28px;
      overflow-x: hidden;
    }

    button { font: inherit; }

    .shell {
      width: min(100%, 1040px);
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(260px, .55fr);
      border: 1px solid var(--line);
      border-radius: calc(var(--radius) + 8px);
      background: rgba(18, 21, 26, .82);
      box-shadow: 0 28px 80px rgba(0, 0, 0, .42);
      backdrop-filter: blur(16px);
      overflow: hidden;
    }

    .timer-panel {
      min-height: 650px;
      padding: clamp(28px, 5vw, 58px);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .timer-panel::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .32;
      background-image: linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: linear-gradient(to bottom, black, transparent 70%);
    }

    .topbar,
    .timer-wrap,
    .controls,
    .shortcuts { position: relative; z-index: 1; }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1rem;
      font-weight: 750;
      letter-spacing: -.02em;
    }

    .mark {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 6px rgba(255,92,53,.11);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: .8rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #59606b;
      transition: background .2s, box-shadow .2s;
    }

    .running .status-dot {
      background: var(--lime);
      box-shadow: 0 0 12px rgba(201,255,90,.65);
    }

    .timer-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 56px 0 42px;
    }

    .eyebrow {
      margin: 0 0 16px;
      color: var(--accent);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .time {
      display: flex;
      align-items: baseline;
      font-variant-numeric: tabular-nums;
      letter-spacing: -.075em;
      line-height: .88;
      white-space: nowrap;
      user-select: none;
    }

    .time-main {
      font-size: clamp(4.1rem, 10.2vw, 8.7rem);
      font-weight: 760;
    }

    .time-ms {
      min-width: 1.9em;
      margin-left: .14em;
      color: var(--muted);
      font-size: clamp(2rem, 4.2vw, 3.55rem);
      font-weight: 700;
      letter-spacing: -.04em;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 12px;
      align-items: center;
    }

    .btn {
      min-height: 58px;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 0 22px;
      background: #191d23;
      color: var(--text);
      cursor: pointer;
      font-weight: 750;
      transition: transform .16s ease, border-color .16s ease, background .16s ease;
      touch-action: manipulation;
    }

    .btn:hover { border-color: #454c57; transform: translateY(-2px); }
    .btn:active { transform: translateY(0); }
    .btn:focus-visible { outline: 3px solid rgba(201,255,90,.55); outline-offset: 3px; }
    .btn:disabled { opacity: .38; cursor: not-allowed; transform: none; }

    .btn-primary {
      background: var(--accent);
      color: #140704;
      border-color: transparent;
      font-size: 1.08rem;
    }

    .btn-primary:hover { background: var(--accent-strong); border-color: transparent; }
    .btn-icon { width: 58px; padding: 0; display: grid; place-items: center; }
    .btn svg { width: 21px; height: 21px; }

    .shortcuts {
      margin-top: 22px;
      color: #717783;
      font-size: .78rem;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    kbd {
      display: inline-grid;
      place-items: center;
      min-width: 25px;
      height: 22px;
      margin-right: 5px;
      padding: 0 6px;
      border: 1px solid #343a44;
      border-bottom-width: 2px;
      border-radius: 6px;
      background: #171a20;
      color: #aab0ba;
      font: 700 .7rem/1 system-ui, sans-serif;
    }

    .laps-panel {
      min-height: 650px;
      padding: 34px 28px;
      border-left: 1px solid var(--line);
      background: rgba(10, 12, 15, .48);
      display: flex;
      flex-direction: column;
    }

    .laps-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 35px;
      margin-bottom: 22px;
    }

    .laps-title { margin: 0; font-size: 1rem; letter-spacing: -.02em; }
    .lap-count { color: var(--muted); font-size: .78rem; }

    .laps-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 7px;
      overflow-y: auto;
      max-height: 510px;
      scrollbar-color: #373d47 transparent;
    }

    .lap {
      display: grid;
      grid-template-columns: 42px 1fr;
      gap: 12px;
      align-items: center;
      padding: 14px 12px;
      border-bottom: 1px solid rgba(255,255,255,.055);
      animation: slideIn .24s ease both;
    }

    .lap-number { color: var(--muted); font: 750 .73rem/1 system-ui, sans-serif; }
    .lap-times { min-width: 0; }
    .lap-total { font-variant-numeric: tabular-nums; font-weight: 720; font-size: .98rem; }
    .lap-split { margin-top: 5px; color: var(--muted); font-size: .75rem; font-variant-numeric: tabular-nums; }

    .empty {
      margin: auto 0;
      text-align: center;
      color: #696f79;
      font-size: .88rem;
      line-height: 1.7;
    }

    .empty-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 14px;
      border: 1px dashed #343a43;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 1.15rem;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-7px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 760px) {
      body { display: block; padding: 0; }
      .shell { min-height: 100vh; border: 0; border-radius: 0; grid-template-columns: 1fr; }
      .timer-panel { min-height: 68vh; padding: 28px 22px 26px; }
      .laps-panel { min-height: 32vh; padding: 25px 22px; border-left: 0; border-top: 1px solid var(--line); }
      .timer-wrap { padding: 50px 0 38px; }
      .controls { grid-template-columns: 1fr 56px 56px; }
      .shortcuts { display: none; }
      .laps-list { max-height: 270px; }
    }

    @media (max-width: 420px) {
      .time-main { font-size: 3.85rem; }
      .time-ms { font-size: 1.8rem; }
      .btn { min-height: 56px; padding: 0 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="shell" id="app">
    <section class="timer-panel" aria-labelledby="page-title">
      <header class="topbar">
        <div class="brand"><span class="mark" aria-hidden="true"></span><span id="page-title">스탑워치</span></div>
        <div class="status" aria-live="polite"><span class="status-dot" aria-hidden="true"></span><span id="statusText">준비</span></div>
      </header>

      <div class="timer-wrap">
        <p class="eyebrow">Elapsed time</p>
        <div class="time" role="timer" aria-live="off" aria-label="경과 시간">
          <span class="time-main" id="timeMain">00:00</span><span class="time-ms" id="timeMs">.00</span>
        </div>
      </div>

      <div class="controls">
        <button class="btn btn-primary" id="toggleBtn" type="button">시작</button>
        <button class="btn btn-icon" id="lapBtn" type="button" aria-label="랩 기록" title="랩 기록" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 4v16M5 5h10l-2 4 2 4H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="btn btn-icon" id="resetBtn" type="button" aria-label="초기화" title="초기화" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.34 5.66M20 4v7h-7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <div class="shortcuts" aria-label="키보드 단축키">
        <span><kbd>Space</kbd> 시작 / 일시정지</span>
        <span><kbd>L</kbd> 랩</span>
        <span><kbd>R</kbd> 초기화</span>
      </div>
    </section>

    <aside class="laps-panel" aria-labelledby="lapsTitle">
      <div class="laps-head">
        <h2 class="laps-title" id="lapsTitle">랩 기록</h2>
        <span class="lap-count" id="lapCount">0개</span>
      </div>
      <ol class="laps-list" id="lapsList"></ol>
      <div class="empty" id="emptyState">
        <div class="empty-icon" aria-hidden="true">＋</div>
        측정 중 랩 버튼을 누르면<br>구간 기록이 여기에 표시됩니다.
      </div>
    </aside>
  </main>

  <script>
    (() => {
      const app = document.getElementById('app');
      const timeMain = document.getElementById('timeMain');
      const timeMs = document.getElementById('timeMs');
      const toggleBtn = document.getElementById('toggleBtn');
      const lapBtn = document.getElementById('lapBtn');
      const resetBtn = document.getElementById('resetBtn');
      const statusText = document.getElementById('statusText');
      const lapsList = document.getElementById('lapsList');
      const lapCount = document.getElementById('lapCount');
      const emptyState = document.getElementById('emptyState');

      let running = false;
      let startedAt = 0;
      let elapsed = 0;
      let animationId = 0;
      let laps = [];

      const currentElapsed = () => running ? elapsed + performance.now() - startedAt : elapsed;

      function parts(ms) {
        const totalCentiseconds = Math.floor(ms / 10);
        const cs = totalCentiseconds % 100;
        const totalSeconds = Math.floor(totalCentiseconds / 100);
        const seconds = totalSeconds % 60;
        const totalMinutes = Math.floor(totalSeconds / 60);
        const minutes = totalMinutes % 60;
        const hours = Math.floor(totalMinutes / 60);
        return { hours, minutes, seconds, cs };
      }

      function format(ms, compact = false) {
        const { hours, minutes, seconds, cs } = parts(ms);
        const prefix = hours > 0 ? `${String(hours).padStart(2, '0')}:` : '';
        return `${prefix}${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}${compact ? '.' + String(cs).padStart(2, '0') : ''}`;
      }

      function paint(ms) {
        const { hours, minutes, seconds, cs } = parts(ms);
        timeMain.textContent = `${hours > 0 ? String(hours).padStart(2, '0') + ':' : ''}${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        timeMs.textContent = `.${String(cs).padStart(2, '0')}`;
      }

      function frame() {
        paint(currentElapsed());
        if (running) animationId = requestAnimationFrame(frame);
      }

      function updateControls() {
        app.classList.toggle('running', running);
        toggleBtn.textContent = running ? '일시정지' : elapsed > 0 ? '계속' : '시작';
        statusText.textContent = running ? '측정 중' : elapsed > 0 ? '일시정지' : '준비';
        lapBtn.disabled = !running;
        resetBtn.disabled = elapsed === 0 && !running;
      }

      function toggle() {
        if (running) {
          elapsed += performance.now() - startedAt;
          running = false;
          cancelAnimationFrame(animationId);
          paint(elapsed);
        } else {
          startedAt = performance.now();
          running = true;
          frame();
        }
        updateControls();
        return state();
      }

      function reset() {
        running = false;
        cancelAnimationFrame(animationId);
        startedAt = 0;
        elapsed = 0;
        laps = [];
        paint(0);
        renderLaps();
        updateControls();
        return state();
      }

      function addLap() {
        if (!running) return state();
        const total = currentElapsed();
        const previous = laps.length ? laps[laps.length - 1].total : 0;
        laps.push({ total, split: total - previous });
        renderLaps();
        return state();
      }

      function renderLaps() {
        lapsList.replaceChildren();
        [...laps].reverse().forEach((lap, reversedIndex) => {
          const number = laps.length - reversedIndex;
          const item = document.createElement('li');
          item.className = 'lap';
          item.innerHTML = `<span class="lap-number">${String(number).padStart(2, '0')}</span><div class="lap-times"><div class="lap-total">${format(lap.total, true)}</div><div class="lap-split">구간 +${format(lap.split, true)}</div></div>`;
          lapsList.appendChild(item);
        });
        lapCount.textContent = `${laps.length}개`;
        emptyState.hidden = laps.length > 0;
      }

      function state() {
        return { running, elapsedMilliseconds: Math.round(currentElapsed()), lapCount: laps.length };
      }

      toggleBtn.addEventListener('click', toggle);
      lapBtn.addEventListener('click', addLap);
      resetBtn.addEventListener('click', reset);

      window.addEventListener('keydown', (event) => {
        if (event.repeat || event.target.matches('input, textarea, select')) return;
        if (event.code === 'Space' || event.code === 'Enter') { event.preventDefault(); toggle(); }
        if (event.key.toLowerCase() === 'l') { event.preventDefault(); addLap(); }
        if (event.key.toLowerCase() === 'r') { event.preventDefault(); reset(); }
      });

      const modelContext = document.modelContext;
      if (modelContext?.registerTool) {
        const tool = (name, title, description, action) => {
          try {
            void Promise.resolve(modelContext.registerTool({
              name, title, description,
              inputSchema: { type: 'object', properties: {}, additionalProperties: false },
              annotations: { readOnlyHint: false, untrustedContentHint: false },
              execute: action
            })).catch(() => {});
          } catch (_) {}
        };
        tool('toggle_stopwatch', '스탑워치 시작 또는 일시정지', '현재 상태에 따라 스탑워치를 시작하거나 일시정지합니다.', toggle);
        tool('record_lap', '랩 기록', '실행 중인 스탑워치에 현재 랩 기록을 추가합니다.', addLap);
        tool('reset_stopwatch', '스탑워치 초기화', '경과 시간과 모든 랩 기록을 초기화합니다.', reset);
      }

      updateControls();
      renderLaps();
    })();
  </script>
</body>
</html>
